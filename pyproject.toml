[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capsulemcp"
version = "0.1.0"
description = "CapsuleMCP — Algorithmic Context Compilation for Multi-Agent AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
